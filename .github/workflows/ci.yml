name: CI Quality Gates

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Run Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: portfolio_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint Verification
        run: npm run lint

      - name: Typecheck Verification
        run: npm run typecheck

      - name: Architecture Boundary Verification
        run: npm run architecture:check

      - name: Architecture Boundary Self-Test
        run: npm run architecture:self-test

      - name: PGlite Isolated Tests
        run: npm run test:pglite

      - name: Safety Guard & Smoke Tests
        run: npm run test -- src/tests/db-safety-guard.test.ts src/tests/smoke.test.ts

      - name: Auth Runtime Tests
        env:
          BETTER_AUTH_SECRET: 'ephemeral-ci-test-secret-at-least-32-chars-long-123456'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DB_USER: postgres
          DB_PASS: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: portfolio_test_db
        run: npm run test:auth

      - name: Real PostgreSQL 16 Integration & Security Tests
        env:
          DB_USER: postgres
          DB_PASS: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: portfolio_test_db
          ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
        run: npm run test:postgres

      - name: Schema Drift Verification
        env:
          DB_USER: postgres
          DB_PASS: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: portfolio_test_db
        run: npm run db:drift

      - name: Migration History Consistency Check
        env:
          DB_USER: postgres
          DB_PASS: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: portfolio_test_db
        run: npm run db:check

      - name: Production Build Verification
        env:
          BETTER_AUTH_SECRET: 'ephemeral-ci-test-secret-at-least-32-chars-long-123456'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgres://postgres:postgrespassword@localhost:5432/portfolio_test_db'
        run: npm run build

      - name: Secret Scan Verification
        run: npm run secret-scan
