version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: maywebeissa_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfolio_test_db
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d portfolio_test_db']
      interval: 2s
      timeout: 5s
      retries: 10
